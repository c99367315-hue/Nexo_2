<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexo - Sección Pollo</title>
    <link rel="stylesheet" href="Pollo.css">
</head>

<body>

    <div class="app-layout">

        <!-- ================= BANNER / HERO ================= -->
        <header class="hero-banner">
            <img 
                src="https://images.unsplash.com/photo-1562967914-608f82629710?auto=format&fit=crop&w=1200&q=85" 
                alt="Pollo frito crocante"
            >
            <div class="banner-overlay"></div>
        </header>


        <!-- ================= CONTENIDO PRINCIPAL ================= -->
        <main class="main-content">

            <div class="section-header">
                <h1>Pollo</h1>
                <span class="badge">3 opciones disponibles</span>
            </div>


            <!-- LISTA DE PRODUCTOS -->
            <section class="product-list">


                <!-- PRODUCTO 1: FRISBY -->
                <article class="product-card">

                    <div class="product-image">
                        <img 
                            src="https://images.unsplash.com/photo-1626082927389-6cd097cdc6ec?auto=format&fit=crop&w=400&q=80" 
                            alt="Pollo Frisby Arepas"
                        >
                    </div>

                    <div class="product-info">
                        <h2>Pollo Frisby Arepas</h2>
                        <p class="description">8 Presas Apanadas y 10 Arepas</p>
                        <div class="product-footer">
                            <span class="price">$59.900</span>
                            <button class="add-btn" aria-label="Agregar al carrito">+</button>
                        </div>
                    </div>

                </article>


                <!-- PRODUCTO 2: KFC -->
                <article class="product-card">

                    <div class="product-image">
                        <img 
                            src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTU-U-SsD0Bl-FPCEz156N6vbVcEHTNVIP4m1OOlq3_iw&s=10" 
                            alt="Medio KFC"
                        >
                    </div>

                    <div class="product-info">
                        <h2>Medio KFC</h2>
                        <p class="description">4 Presas Y 2 papas pequeñas</p>
                        <div class="product-footer">
                            <span class="price">$19.500</span>
                            <button class="add-btn" aria-label="Agregar al carrito">+</button>
                        </div>
                    </div>

                </article>


                <!-- PRODUCTO 3: KOKORICO -->
                <article class="product-card">

                    <div class="product-image">
                        <img 
                            src="https://images.unsplash.com/photo-1626645738196-c2a7c87a8f58?auto=format&fit=crop&w=400&q=80" 
                            alt="Kronch Kokorico"
                        >
                    </div>

                    <div class="product-info">
                        <h2>Kronch Kokorico</h2>
                        <p class="description">8 Presas crocantes</p>
                        <div class="product-footer">
                            <span class="price">$43.900</span>
                            <button class="add-btn" aria-label="Agregar al carrito">+</button>
                        </div>
                    </div>

                </article>


            </section>

        </main>


        <!-- ================= NAVBAR INFERIOR (ESTILO APP) ================= -->
        <nav class="bottom-nav">

            <a href="#" class="nav-item active">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                <span>Inicio</span>
            </a>

            <a href="#" class="nav-item">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <span>Buscar</span>
            </a>

            <a href="#" class="nav-item">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                <span>Avisos</span>
            </a>

            <a href="#" class="nav-item">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
                <span>Carrito</span>
            </a>

        </nav>

    </div>

</body>

</html>
