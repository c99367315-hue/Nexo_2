<!DOCTYPE html>

    <!-- =========================

        <section class="perfil-header">

            <button class="foto-perfil" title="Cambiar foto de perfil">

        <!-- =========================

        ========================= -->

        <div class="secciones-perfil">

            <button class="seccion activa">

                <a href="perfil2.html">Mis actividades</a>
            </button> -->
            <a href="perfil2.html" class="boton seccion">>Mis actividades</a>

        <!-- =========================

        ========================= -->

        <section class="detalles">


            <!-- NOMBRE -->

            <div class="dato">

                <div class="dato-informacion">

                    <span>
                        Nombre
                    </span>

                    <p>
                        Jeronimo Montoya Rivera
                    </p>

                </div>


                <button class="editar" title="Editar nombre">
                    ✎
                </button>

            </div>



            <!-- CORREO -->

            <div class="dato">

                <div class="dato-informacion">

                    <span>
                        Correo electrónico
                    </span>

                    <p>
                        Jeronimo1724@gmail.com
                    </p>

                </div>


                <button class="editar" title="Editar correo">
                    ✎
                </button>

            </div>



            <!-- COLEGIO -->

            <div class="dato">

                <div class="dato-informacion">

                    <span>
                        Colegio
                    </span>

                    <p>
                        I. E. LA SALLE DE CAMPOAMOR
                    </p>

                </div>


                <button class="editar" title="Editar colegio">
                    ✎
                </button>

            </div>



            <!-- GRADO -->

            <div class="dato">

                <div class="dato-informacion">

                    <span>
                        Grado
                    </span>

                    <p>
                        11
                    </p>

                </div>


                <button class="editar" title="Editar grado">
                    ✎
                </button>

            </div>



            <!-- =========================
                 CERTIFICADO
            ========================= -->

            <button class="certificado">

                <span class="certificado-icono">
                    📄
                </span>

                <span>
                    Certificado de estudio
                </span>

                <span class="certificado-flecha">
                    →
                </span>

            </button>



            <!-- =========================
                 CERRAR SESIÓN
            ========================= -->

            <button class="cerrar-sesion">
                Cerrar sesión
            </button>
