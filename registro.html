<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registrarse - NEXO</title>

    <link rel="stylesheet" href="registro.css">
</head>

<body>

    <main class="contenedor-registro">

        <section class="tarjeta-registro">

            <div class="logo">NEXO</div>

            <h1>Crear cuenta</h1>

            <p class="subtitulo">
                Regístrate para comenzar a usar NEXO
            </p>


            <form>


                <!-- NOMBRE Y APELLIDO -->

                <div class="fila">

                    <div class="campo">

                        <label for="nombre">
                            Nombre
                        </label>

                        <input
                            type="text"
                            id="nombre"
                            placeholder="Tu nombre"
                            required
                        >

                    </div>


                    <div class="campo">

                        <label for="apellido">
                            Apellido
                        </label>

                        <input
                            type="text"
                            id="apellido"
                            placeholder="Tu apellido"
                            required
                        >

                    </div>

                </div>


                <!-- CORREO -->

                <div class="campo">

                    <label for="correo">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="correo"
                        placeholder="Tu correo electrónico"
                        required
                    >

                </div>


                <!-- COLEGIO -->

                <div class="campo">

                    <label for="colegio">
                        Colegio
                    </label>

                    <input
                        type="text"
                        id="colegio"
                        placeholder="Nombre de tu colegio"
                        required
                    >

                </div>


                <!-- GRADO -->

                <div class="campo">

                    <label for="grado">
                        Grado
                    </label>

                    <select id="grado" required>

                        <option value="">
                            Selecciona tu grado
                        </option>

                        <option value="6">6°</option>
                        <option value="7">7°</option>
                        <option value="8">8°</option>
                        <option value="9">9°</option>
                        <option value="10">10°</option>
                        <option value="11">11°</option>

                    </select>

                </div>


                <!-- CONTRASEÑA -->

                <div class="fila">

                    <div class="campo">

                        <label for="contrasena">
                            Contraseña
                        </label>

                        <input
                            type="password"
                            id="contrasena"
                            placeholder="Crea una contraseña"
                            required
                        >

                    </div>


                    <div class="campo">

                        <label for="confirmar">
                            Confirmar contraseña
                        </label>

                        <input
                            type="password"
                            id="confirmar"
                            placeholder="Repite tu contraseña"
                            required
                        >

                    </div>

                </div>


                <!-- CERTIFICADO -->

                <div class="certificado">

                    <div class="certificado-texto">

                        <div class="icono-certificado">
                            📄
                        </div>

                        <div>

                            <h3>
                                Certificado de estudio
                                <span>*</span>
                            </h3>

                            <p>
                                Debes adjuntar un certificado que demuestre que actualmente eres estudiante.
                            </p>

                        </div>

                    </div>


                    <label
                        for="archivo-certificado"
                        class="btn-subir"
                    >
                        📎 Subir certificado
                    </label>


                    <input
                        type="file"
                        id="archivo-certificado"
                        accept=".pdf,.jpg,.jpeg,.png"
                        required
                    >

                </div>


                <!-- BOTÓN -->

                <button
                    type="submit"
                    class="btn-registro"
                >
                    Crear cuenta
                </button>


            </form>


            <div class="login">

                <span>
                    ¿Ya tienes una cuenta?
                </span>

                <a href="inicio-sesion.html">
                    Iniciar sesión
                </a>

            </div>

        </section>

    </main>

</body>
</html>
