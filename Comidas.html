<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Comida</title>

    <link rel="stylesheet" href="Comidas.css">
</head>

<body>

    <!-- BARRA SUPERIOR -->
    <header class="barra-superior">

        <div class="logo">
            NEXO
        </div>

        <nav class="menu">

            <a href="#">🏠 Inicio</a>

            <a href="#" class="activo">🍔 Comida</a>

            <a href="#">🍽 Restaurantes</a>

            <a href="#">🛒 Carrito</a>

            <a href="#">👤 Perfil</a>

        </nav>

    </header>


    <!-- CONTENIDO PRINCIPAL -->
    <main class="contenido">

        <section class="encabezado">

            <div>
                <h1>Comida</h1>

                <p>
                    Encuentra tus comidas favoritas
                </p>
            </div>

            <div class="usuario">
                👤
            </div>

        </section>


        <!-- BUSCADOR -->
        <div class="buscador">

            <input 
                type="text"
                placeholder="Buscar hamburguesas, pizza, pollo..."
            >

            <button>
                🔍 Buscar
            </button>

        </div>


        <!-- CATEGORÍAS -->
        <section class="titulo">

            <h2>
                Categorías de comida
            </h2>

            <p>
                Elige el tipo de comida que deseas disfrutar
            </p>

        </section>


        <section class="categorias">


            <!-- HAMBURGUESAS -->

            <div class="card-comida">

                <div class="imagen-comida">

                    <img 
                        src="img/hamburguesa.png"
                        alt="Hamburguesas"
                    >

                </div>

                <div class="info-comida">

                    <h3>
                        Hamburguesas
                    </h3>

                    <p>
                        McDonald's
                    </p>

                    <button>
                        Ver comidas
                    </button>

                </div>

            </div>


            <!-- SÁNDWICHES -->

            <div class="card-comida">

                <div class="imagen-comida">

                    <img 
                        src="img/sandwich.png"
                        alt="Sándwiches"
                    >

                </div>

                <div class="info-comida">

                    <h3>
                        Sándwiches
                    </h3>

                    <p>
                        Subway
                    </p>

                    <button>
                        Ver comidas
                    </button>

                </div>

            </div>


            <!-- HELADOS -->

            <div class="card-comida">

                <div class="imagen-comida">

                    <img 
                        src="img/helado.png"
                        alt="Helados"
                    >

                </div>

                <div class="info-comida">

                    <h3>
                        Helados
                    </h3>

                    <p>
                        Santa Rosa
                    </p>

                    <button>
                        Ver comidas
                    </button>

                </div>

            </div>


            <!-- POLLO -->

            <div class="card-comida">

                <div class="imagen-comida">

                    <img 
                        src="img/pollo.png"
                        alt="Pollo"
                    >

                </div>

                <div class="info-comida">

                    <h3>
                        Pollo
                    </h3>

                    <p>
                        Frisby
                    </p>

                    <button>
                        Ver comidas
                    </button>

                </div>

            </div>


            <!-- POLLO FRITO -->

            <div class="card-comida">

                <div class="imagen-comida">

                    <img 
                        src="img/pollo-frito.png"
                        alt="Pollo frito"
                    >

                </div>

                <div class="info-comida">

                    <h3>
                        Pollo frito
                    </h3>

                    <p>
                        KFC
                    </p>

                    <button>
                        Ver comidas
                    </button>

                </div>

            </div>


            <!-- PIZZA -->

            <div class="card-comida">

                <div class="imagen-comida">

                    <img 
                        src="img/pizza.png"
                        alt="Pizza"
                    >

                </div>

                <div class="info-comida">

                    <h3>
                        Pizza
                    </h3>

                    <p>
                        Pizza Hut
                    </p>

                    <button>
                        Ver comidas
                    </button>

                </div>

            </div>


        </section>

    </main>

</body>
</html>
